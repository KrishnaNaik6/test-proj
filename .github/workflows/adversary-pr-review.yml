name: Adversary Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write  # Allows the action to comment on the PR

jobs:
  adversary-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Adversary
        # If adversary is in the same repo, install with: pip install -e .
        # Or install from your adversary repo/package
        run: |
          pip install --upgrade pip
          pip install -e .

      - name: Run Evidence-Gated Review
        run: |
          adversary review .

      - name: Generate PR Markdown Report
        run: |
          adversary report --format markdown --output pr_report.md

      - name: Post Review Comment to PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            if (fs.existsSync('pr_report.md')) {
              const body = fs.readFileSync('pr_report.md', 'utf8');
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }