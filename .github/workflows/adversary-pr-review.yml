name: Adversary Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write  # Needed to post comments on the PR

jobs:
  adversary-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Adversary
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Run Evidence-Gated Review
        run: |
          python -m adversary review .

      - name: Generate PR Markdown Report
        run: |
          python -m adversary report --format markdown --output pr_report.md

      - name: Post Review Comment to PR
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            if (fs.existsSync('pr_report.md')) {
              const body = fs.readFileSync('pr_report.md', 'utf8');
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            } else {
              console.log('No pr_report.md found to post.');
            }